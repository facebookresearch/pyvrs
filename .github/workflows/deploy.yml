name: Deployment

on:
  # this workflow can only be manually triggered for now.
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Where to deploy the artifacts? Only build (build), deploy to test PyPI (test), or deploy to PyPI (prod).'
        required: true
        type: choice
        default: 'test'
        options:
          - build
          - test
          - prod

jobs:
  create-sdist:
    if: github.repository == 'facebookresearch/pyvrs'
    runs-on: ubuntu-latest
    name: Create source Distribution
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Upgrade pip
        run: |
          python3 -m pip install --upgrade pip
      - name: Create Source Distribution
        run: |
          python3 -m pip install setuptools wheel twine
          python3 setup.py sdist

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-sdist
          path: dist/*.tar.gz

  build-wheels:
    if: github.repository == 'facebookresearch/pyvrs'
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Keep the macOS runner equal to MACOSX_DEPLOYMENT_TARGET: Homebrew's
        # dylibs target the runner's OS, and delocate-wheel rejects any newer
        # than the wheel's target. ubuntu-24.04 is pinned so a moved
        # ubuntu-latest label cannot change the build host.
        os: [macos-14, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upgrade pip
        run: |
          python3 -m pip install --upgrade pip

      - name: Install cibuildwheel
        run: |
          python3 -m pip install cibuildwheel==4.2.1

      # cmake/FindEigen.cmake clones Eigen from GitLab on every cmake run, and
      # GitLab fails some of those clones under load. Clone the same commit
      # once, with retries; FETCHCONTENT_SOURCE_DIR_EIGEN points every build at it.
      - name: Fetch Eigen
        run: |
          for attempt in 1 2 3 4 5; do
            rm -rf .eigen-src
            git init -q .eigen-src
            if git -C .eigen-src fetch -q --depth 1 https://gitlab.com/libeigen/eigen.git \
                19cacd3ecb9dab73c2dd7bc39d9193e06ba92bdd \
              && git -C .eigen-src checkout -q FETCH_HEAD; then
              exit 0
            fi
            echo "Fetching Eigen failed (attempt $attempt), retrying"
            sleep $((attempt * 15))
          done
          exit 1

      # One cibuildwheel run builds every version. cibuildwheel.toml picks the
      # manylinux image per version, and before-all builds the dependencies once
      # per container (once per manylinux image on Linux) rather than per wheel.
      - name: Build wheels for CPython 3.9-3.14
        run: |
          python3 -m cibuildwheel --config-file cibuildwheel.toml --output-dir dist
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=14.0 CMAKE_ARGS=-DFETCHCONTENT_SOURCE_DIR_EIGEN=$GITHUB_WORKSPACE/.eigen-src"
          CIBW_ENVIRONMENT_LINUX: "CMAKE_ARGS=-DFETCHCONTENT_SOURCE_DIR_EIGEN=/project/.eigen-src"
          CIBW_BUILD: "cp39-*64 cp310-*64 cp311-*64 cp312-*64 cp313-*64 cp314-*64"
          CIBW_BEFORE_ALL_LINUX: bash scripts/install-manylinux-deps.sh
          CIBW_BEFORE_ALL_MACOS: bash scripts/install-macos-deps.sh
          CIBW_SKIP: "*-manylinux_i686 *musllinux*"
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-${{ matrix.os }}
          path: dist

  publish-to-pypi:
    runs-on: ubuntu-latest
    needs:
      - build-wheels
      - create-sdist
    steps:
    - name: Download all artifacts
      # by default this will download all artifacts
      uses: actions/download-artifact@v4
      with:
        # PyPI publish action uploads everything under dist/* by default
        path: dist
        merge-multiple: true

    - name: Display the list of artifacts
      run: ls -R dist

    - name: Publish to Test PyPI
      if: github.event.inputs.deploy == 'test'
      uses: pypa/gh-action-pypi-publish@v1.4.2
      with:
        user: __token__
        password: ${{ secrets.TEST_PYPI_TOKEN }}
        repository_url: https://test.pypi.org/legacy/
        skip_existing: true
        verbose: true

    - name: Publish to PyPI
      if: github.event.inputs.deploy == 'prod' && startsWith(github.ref, 'refs/tags')
      uses: pypa/gh-action-pypi-publish@v1.4.2
      with:
        user: __token__
        password: ${{ secrets.PYPI_TOKEN }}
        verbose: true
