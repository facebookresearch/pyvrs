name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build pyvrs on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Keep the macOS runner equal to MACOSX_DEPLOYMENT_TARGET: Homebrew's
        # dylibs target the runner's OS, and delocate-wheel rejects any newer
        # than the wheel's target. ubuntu-24.04 is pinned so a moved
        # ubuntu-latest label cannot change the host the editable install and
        # tests run on.
        os: [ubuntu-24.04, macos-14]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      # cibuildwheel needs >=3.11 to run, so it gets its own interpreter. 3.9
      # stays the default because the editable install and tests below use it.
      - name: Set up Python for cibuildwheel
        id: cibw_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update -y
            sudo apt-get install -o Acquire::Retries=5 \
              cmake git ninja-build libgtest-dev libfmt-dev \
              libjpeg-dev libturbojpeg-dev libpng-dev \
              liblz4-dev libzstd-dev libxxhash-dev \
              libboost-system-dev libboost-filesystem-dev libboost-thread-dev libboost-chrono-dev libboost-date-time-dev \
              portaudio19-dev libopus-dev
            python -m pip install -U pip
            python -m pip install pybind11[global]

          elif [ "$RUNNER_OS" == "macOS" ]; then
              # Update or install cmake
              brew upgrade cmake || brew install cmake
              brew install git ninja googletest glog fmt \
                  jpeg-turbo libpng \
                  lz4 zstd xxhash \
                  boost \
                  portaudio opus pybind11

          else
              echo "$RUNNER_OS not supported"
              exit 1
          fi
          python -m pip install -U pip
          python -m pip install numpy typing dataclasses pytest parameterized Pillow
          ${{ steps.cibw_python.outputs.python-path }} -m pip install --upgrade pip
          ${{ steps.cibw_python.outputs.python-path }} -m pip install cibuildwheel==4.2.1

      # cmake/FindEigen.cmake clones Eigen from GitLab on every cmake run, and
      # GitLab fails some of those clones under load. Clone the same commit
      # once, with retries; FETCHCONTENT_SOURCE_DIR_EIGEN points every build at it.
      - name: Fetch Eigen
        run: |
          for attempt in 1 2 3 4 5; do
            rm -rf .eigen-src
            git init -q .eigen-src
            if git -C .eigen-src fetch -q --depth 1 https://gitlab.com/libeigen/eigen.git \
                19cacd3ecb9dab73c2dd7bc39d9193e06ba92bdd \
              && git -C .eigen-src checkout -q FETCH_HEAD; then
              exit 0
            fi
            echo "Fetching Eigen failed (attempt $attempt), retrying"
            sleep $((attempt * 15))
          done
          exit 1

      # One cibuildwheel run builds every version. cibuildwheel.toml picks the
      # manylinux image per version, and before-all builds the dependencies once
      # per container (once per manylinux image on Linux) rather than per wheel.
      - name: Build wheels for CPython 3.9-3.14
        run: |
          ${{ steps.cibw_python.outputs.python-path }} -m cibuildwheel --config-file cibuildwheel.toml --output-dir dist
        env:
          CIBW_ARCHS_LINUX: x86_64
          # macos-14 runners are Apple Silicon.
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=14.0 CMAKE_ARGS=-DFETCHCONTENT_SOURCE_DIR_EIGEN=$GITHUB_WORKSPACE/.eigen-src"
          CIBW_ENVIRONMENT_LINUX: "CMAKE_ARGS=-DFETCHCONTENT_SOURCE_DIR_EIGEN=/project/.eigen-src"
          CIBW_BUILD: "cp39-*64 cp310-*64 cp311-*64 cp312-*64 cp313-*64 cp314-*64"
          CIBW_BEFORE_ALL_LINUX: bash scripts/install-manylinux-deps.sh
          CIBW_BEFORE_ALL_MACOS: bash scripts/install-macos-deps.sh
          CIBW_SKIP: "*-manylinux_i686 *musllinux*"

      - name: Build and Test Python
        shell: bash
        env:
          CMAKE_ARGS: -DFETCHCONTENT_SOURCE_DIR_EIGEN=${{ github.workspace }}/.eigen-src
        run: |
          pip install -e .
          python -m pytest test

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl
