# cibuildwheel options that vary by Python version, which its environment
# variables cannot express. The workflows pass this file with --config-file.
[tool.cibuildwheel]
# Pinned rather than left to the cibuildwheel default, which moved to
# manylinux_2_28 in 3.0. 3.9-3.12 keep manylinux2014's glibc 2.17 floor.
manylinux-x86_64-image = "manylinux2014"

# 3.13 and 3.14 are not available on manylinux2014, an EOL image.
[[tool.cibuildwheel.overrides]]
select = "cp313-* cp314-*"
manylinux-x86_64-image = "manylinux_2_28"
